components:
  schemas:
    AccountTypeEnum:
      enum:
      - PREPAID
      - CREDIT_MONTHLY
      type: string
      description: |-
        * `PREPAID` - Compte Prépayé (Acompte)
        * `CREDIT_MONTHLY` - Client Conventionné (Facture Fin de Mois)
    CashSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cashier:
          type: integer
          title: Caissier / Responsable
        cashier_username:
          type: string
          readOnly: true
        session_date:
          type: string
          format: date
          title: Date de session
        opened_at:
          type: string
          format: date-time
          readOnly: true
          title: Ouverte à
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Clôturée à
        initial_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Fonds de caisse initial (FCFA)
        expected_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Total théorique espèces attendu (FCFA)
        actual_cash_counted:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          title: Espèces réelles comptées (FCFA)
        cash_difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: Écart de caisse (FCFA)
        status:
          allOf:
          - $ref: '#/components/schemas/CashSessionStatusEnum'
          title: Statut de la session
        notes:
          type: string
          title: Observations
        total_sales_count:
          type: integer
          readOnly: true
      required:
      - cash_difference
      - cashier
      - cashier_username
      - closed_at
      - id
      - opened_at
      - total_sales_count
    CashSessionCloseRequest:
      type: object
      properties:
        actual_cash_counted:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        notes:
          type: string
          default: ''
      required:
      - actual_cash_counted
    CashSessionOpenRequest:
      type: object
      properties:
        initial_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        notes:
          type: string
          default: ''
    CashSessionRequest:
      type: object
      properties:
        cashier:
          type: integer
          title: Caissier / Responsable
        session_date:
          type: string
          format: date
          title: Date de session
        initial_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Fonds de caisse initial (FCFA)
        expected_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Total théorique espèces attendu (FCFA)
        actual_cash_counted:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          title: Espèces réelles comptées (FCFA)
        status:
          allOf:
          - $ref: '#/components/schemas/CashSessionStatusEnum'
          title: Statut de la session
        notes:
          type: string
          title: Observations
      required:
      - cashier
    CashSessionStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Session Ouverte
        * `CLOSED` - Session Clôturée
    CheckoutItemRequest:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - product_id
      - quantity
    CheckoutRequestRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItemRequest'
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodD3cEnum'
          default: ESPECE
        customer_id:
          type: integer
          nullable: true
        amount_received:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        session_id:
          type: integer
          nullable: true
      required:
      - items
    ClaimTypeEnum:
      enum:
      - EXPIRED_RECEIVED
      - MISSING_ITEM
      - WRONG_PRODUCT
      - DAMAGED
      type: string
      description: |-
        * `EXPIRED_RECEIVED` - Produit reçu périmé ou proche péremption
        * `MISSING_ITEM` - Produit facturé mais manquant
        * `WRONG_PRODUCT` - Erreur de produit livré (Non conforme)
        * `DAMAGED` - Produit cassé / Emballage détérioré
    CustomTokenObtainPairRequest:
      type: object
      description: Custom JWT Serializer adding tenant and role claims into access
        tokens.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    CustomerAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom complet / Entreprise
          maxLength: 255
        phone:
          type: string
          title: Téléphone
          maxLength: 64
        email:
          title: Adresse email
