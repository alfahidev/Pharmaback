  /api/pharmacy/billing/financial-statement/:
    get:
      operationId: pharmacy_billing_financial_statement_retrieve
      description: Renvoie les indicateurs financiers consolidés (Total Ventes TTC/HT,
        Dépenses, Solde Net, Marge Brute estimée, Ventilation par mode de règlement
        et créances clients).
      summary: État Financier Consolidé de l'Officine
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: Date de fin (YYYY-MM-DD) si période custom
      - in: query
        name: payment_method
        schema:
          type: string
        description: Filtrer par mode de paiement (ESPECE, WAVE, OMONEY...)
      - in: query
        name: period
        schema:
          type: string
        description: 'Période: ''today'', ''week'', ''month'', ''custom'''
      - in: query
        name: start_date
        schema:
          type: string
        description: Date de début (YYYY-MM-DD) si période custom
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Bilan financier consolidé
