name: PharmaBack CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Quality Gate 1: Code Quality, Lint & Security
  # ============================================================================
  quality:
    name: 🔍 Lint, Syntax & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Check
        run: |
          python -m compileall apps/ tenancy/ core/ common/

      - name: Django System Check
        run: |
          python manage.py check --settings=core.settings.development

  # ============================================================================
  # Quality Gate 2: Automated Tests with PostgreSQL & Redis Services
  # ============================================================================
  test:
    name: 🧪 Automated Test Suite (PostgreSQL 16 + Redis)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmaback_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Test Suite
        env:
          DJANGO_ENV: development
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: pharmaback_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-production-grade-quality-gate
        run: |
          python manage.py test tests -v 2

  # ============================================================================
  # Quality Gate 3: Docker Build & Verification
  # ============================================================================
  docker-build:
    name: 🐳 Build & Verify Production Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pharmaback:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Quality Gate 4: Zero-Downtime Deployment (Main branch only)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Contabo VPS (Docker Swarm)
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Pulling latest code and deploying to Docker Swarm..."
            cd /opt/pharmaback || cd /home/${{ secrets.VPS_USER }}/pharmaback
            git pull origin main
            docker build -t pharmaback:latest .
            docker stack deploy -c docker-stack.yml pharmaback --prune --with-registry-auth
            echo "✅ Deployment completed successfully!"
